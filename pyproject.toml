[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "resale-radar-bot"
version = "0.1.0"
description = "Telegram bot that scores classified listings for resale potential"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiogram>=3.15,<4",
  "aiosqlite>=0.20,<1",
  "httpx>=0.25,<0.26",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.8,<1"]

[project.scripts]
resale-radar = "resale_bot.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/resale_bot"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"


name = "resale-radar-bot"
main = "src/index.js"
compatibility_date = "2026-11-14"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/telegram/*", "/health"]

[triggers]
crons = ["*/5 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "resale-radar"
# После команды `npx wrangler d1 create resale-radar` вставьте сюда database_id.
database_id = "038b9fea-d4e0-403b-bb17-2f6df3d56038"

[vars]
DEFAULT_SALE_FEE_PERCENT = "5"
DEFAULT_FIXED_COSTS = "500"
MIN_COMPARABLES = "3"
# Необязательно. Пустое значение разрешает доступ всем.
ALLOWED_USER_IDS = "815803688"
# Необязательно. URL разрешённого JSON-feed с объявлениями.
LISTINGS_FEED_URL = ""
APP_URL = "https://resale-radar-bot.v039ro73.workers.dev"


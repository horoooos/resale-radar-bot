name: Verify live Mini App API
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Read-only production checks
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: node scripts/verify_app_api.mjs

name: Collect Avito deals
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
concurrency:
  group: collect-avito
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install camoufox patchright
      - uses: actions/cache/restore@v4
        id: browser-cache
        with:
          path: ~/.cache/camoufox
          key: camoufox-browser-ubuntu24-v1
      - run: python -m camoufox fetch
      - uses: actions/cache/save@v4
        if: steps.browser-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/camoufox
          key: camoufox-browser-ubuntu24-v1
      - run: sudo apt-get install -y --no-install-recommends libgtk-3-0t64 libdbus-glib-1-2 libasound2t64
      - name: Scan saved searches and send results to bot
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          COLLECTOR_TOKEN: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
        run: xvfb-run -a python scripts/collect_avito.py
      - name: Publish daily operational snapshot
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          COLLECT_RESULT: ${{ job.status }}
        run: node scripts/publish_collector_health.mjs

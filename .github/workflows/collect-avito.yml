name: Collect Avito deals
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
concurrency:
  group: collect-avito
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install patchright
      - name: Scan saved searches and send results to bot
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          COLLECTOR_TOKEN: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
        run: xvfb-run -a python scripts/collect_avito.py
